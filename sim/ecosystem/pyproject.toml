[project]
name = "eco"
version = "0.1.0"
description = "Лесная экосистема с решениями Kev: симуляция без графики и замеры"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "httpx>=0.28",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
